server {
    listen 80;
    server_name 87.242.119.237;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 308 https://87.242.119.237$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 87.242.119.237;
    ssl_certificate /etc/letsencrypt/live/87.242.119.237/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/87.242.119.237/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    server_tokens off;

    resolver 127.0.0.11 valid=5s ipv6=off;
    root /usr/share/nginx/html/current;
    location = /api {
        return 308 /api/;
    }
    location /api/ {
        set $backend http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /index.html {
        try_files /index.html @frontend_unavailable;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location @frontend_unavailable {
        return 404;
    }
}
