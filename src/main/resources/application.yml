spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/dancehall
    username: dancehall
    password: dancehall
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  servlet:
    context-path: /api/v1