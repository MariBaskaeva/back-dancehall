databaseChangeLog:
  - changeSet:
      id: 002-create-step-table
      author: dancehall
      changes:
        - createTable:
            tableName: step
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: slug
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false

              - column:
                  name: style
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: era
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: step
            baseColumnNames: author_id
            referencedTableName: author
            referencedColumnNames: id
            constraintName: fk_step_author

        - createIndex:
            tableName: step
            indexName: idx_step_author_id
            columns:
              - column:
                  name: author_id

        - createIndex:
            tableName: step
            indexName: idx_step_name
            columns:
              - column:
                  name: name