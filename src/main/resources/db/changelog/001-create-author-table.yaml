databaseChangeLog:
  - changeSet:
      id: 001-create-author-table
      author: dancehall
      changes:
        - createTable:
            tableName: author
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: slug
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: author
            indexName: idx_author_name
            columns:
              - column:
                  name: name